name: Checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CI: true
